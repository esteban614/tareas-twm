<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
</head>
<body>
    <form action="done.html" method="get">
        Identificación del alumno
        <br>
        <label for="name">Nombre</label>
        <input id="name" name="name" placeholder="ej. Diego Muñoz" required>
        <br>
        <label for="rut">RUT</label>
        <input id="rut" name="rut" placeholder="11.111.111-1" required>
        <br>
        <label for="email">Correo</label>
        <input id="email" name="email" placeholder="a@gmail.com" required>
        <br>
        <label for="phone">Teléfono</label>
        <input id="phone" name="phone" placeholder="+56 9 1234 5678" required type="tel">
        <br>
        Datos académicos
        <br>
        <label for="major">Carrera</label>
        <select id="major" name="major">
            <option>
            <option>Ingeniería Civil</option>
            <option>Ingeniería Civil Eléctrica</option>
            <option>Ingeniería Civil Industrial</option>
            <option>Ingeniería Civil Informática</option>
        </select>
        <br>
        <!-- No es obligatorio pero se ve medio feo sin otro line break -->
        <br>
        <fieldset>
            <legend>Jornada</legend>
            <div>
                <input type="radio" id="day" name="time" value="day">
                <label for="morning">Diurna</label>
            </div>
            <div>
                <input type="radio" id="night" name="time" value="night">
                <label for="night">Vespertina</label>
            </div>
        </fieldset>
        <!-- No es obligatorio pero se ve medio feo sin un line break -->
        <br>
        <label for="location">Campus/Sede</label>
        <select id="location" name="location">
            <option>
            <option>Puerto Montt</option>
            <option>Osorno</option>
            <option>Chiloé</option>
            <option>Santiago</option>
        </select>
        <br>
        <input type="checkbox" required>Acepto términos y condiciones</input>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
